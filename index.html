<!DOCTYPE html>
<html>
    <head>
        <title>Minesweeper</title>
    </head>
    <body>        
        <div>
            <h2>Minesweeper</h2>
        
            <p id="message" style="font-size:40px;"></p>
            <button id="btnReset">Reset</button>
            <button id="btnSave">Save</button>
            <button id="btnLoad">Load</button>
        
        </div>
        <div id="grid"></div>
        <script type="module" src="./game/index.js"></script>
        <style>
            #grid {
                display: flex;
                flex-direction: column;
                width: 100%;
                height: 100%;
                padding: 10px;
            }
            #grid button {
                background-color: transparent;
                border: none;
                width: 100%;
                height: 100%;
                padding: 0;
                margin: 0;
                cursor: pointer;
            }
            #grid tr {
                display: flex;
            }
            #grid td {
                width: 32px;
                height: 32px;
                border: 1px solid #000;
                display: flex;
                justify-content: center;
                align-items: center;
            }
        </style>
    </body>

</html>
